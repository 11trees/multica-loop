version: 1
id: reproduction
agent: repro-agent

artifacts:
  reproduction:
    type: builtin
    title: 问题复现证据
    blocks:
      verdict:
        title: 复现结论
        cardinality: one
        format: yaml
        required: true
        fields:
          status: { type: enum, required: true, values: [reproduced, not_reproduced], label: 复现状态 }
          expectedBehavior: { type: string, required: true, label: 预期行为 }
          actualBehavior: { type: string, required: true, label: 实际行为 }
          environment: { type: string, required: true, label: 复现环境 }
          stability: { type: string, required: true, label: 稳定性 }
          impactScope: { type: string, required: true, label: 影响范围 }
      steps:
        title: 复现步骤
        cardinality: many
        format: yaml
        required: true
        fields:
          action: { type: string, required: true, label: 操作 }
          expected: { type: string, required: true, label: 预期结果 }
          actual: { type: string, required: true, label: 实际结果 }
      evidence:
        title: 复现证据
        cardinality: many
        format: yaml
        required: true
        fields:
          kind: { type: enum, required: true, values: [log, screenshot, command, observation], label: 证据类型 }
          content: { type: string, required: true, label: 证据内容 }
          source: { type: string, required: true, label: 证据来源 }
      hypotheses:
        title: 调查方向
        cardinality: many
        format: yaml
        fields:
          status: { type: enum, required: true, values: [suspected, excluded], label: 状态 }
          statement: { type: string, required: true, label: 假设 }
          evidence: { type: string, required: true, label: 证据 }
      answer-review:
        title: 对齐答案复查
        cardinality: one
        format: markdown
        required: true

phases:
  # Investigate without changing persistent repository files.
  investigation:
    type: artifact
    artifacts:
      - reproduction.verdict
      - reproduction.steps
      - reproduction.evidence
      - reproduction.hypotheses
    instructions: 建立最小充分的复现记录。Expected 只陈述报告或既有规范中的候选预期，Actual 只陈述当前条件下观察到的事实；明确环境、稳定性、最小影响范围、可重复步骤和可定位证据。无法确认不等于问题不存在，根因假设只用于指导调查，不得变成实现方案。

  # Ask only for missing human facts that affect reproduction conditions.
  alignment_proposal:
    type: builtin
    builtin: decision-proposal

  # Resolve the original keys and pause for a complete human question batch.
  alignment_resolution:
    type: builtin
    builtin: decision-resolution

  # Review the combined effect of answers; rewind investigation for renewed observations.
  answer_review:
    type: builtin
    builtin: decision-answer-review
    artifacts: [reproduction.answer-review]

  # Only reproduced with conditions, steps and observations can proceed to planning.
  finalize:
    type: builtin
    builtin: reproduction-finalize
