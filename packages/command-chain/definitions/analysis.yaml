version: 2
id: delivery-analysis
agent: analyst-agent

artifacts:
  delivery-analysis:
    type: builtin
    title: 交付分析
    blocks:
      impacts:
        title: 现状与影响扫描
        cardinality: many
        format: yaml
        required: true
        fields:
          area: { type: string, required: true, label: 影响区域 }
          finding: { type: string, required: true, label: 发现 }
          disposition: { type: enum, required: true, values: [change, preserve, exclude, needs_decision], label: 处置 }
          evidence: { type: string, required: true, label: 证据 }
          decision: { type: string, label: 决策 Key }
      answer-review: { title: 答案复查, cardinality: one, format: markdown, required: true }
      summary: { title: 交付摘要, cardinality: one, format: markdown, required: true }
      contract: { title: 交付契约, cardinality: one, format: markdown, required: true }
      guardrails:
        title: 实现护栏
        cardinality: many
        format: yaml
        fields:
          content: { type: string, required: true, label: 护栏 }
          rationale: { type: string, required: true, label: 原因 }
      verification-focus:
        title: 验证重点
        cardinality: many
        format: yaml
        fields:
          expected: { type: string, required: true, label: 预期结果 }
          oracle: { type: string, required: true, label: 验证 Oracle }

phases:
  delivery_unit:
    type: builtin
    builtin: delivery-unit
  impact_scan:
    type: artifact
    artifacts: [delivery-analysis.impacts]
    instructions: 读取冻结业务契约与实时项目证据，登记真正会改变、保持、排除或需要决策的影响。每项影响必须提供可定位证据；needs_decision 必须关联稳定 decision key。本阶段不要提前编写最终交付契约。
  decision_proposal:
    type: builtin
    builtin: decision-proposal
  decision_resolution:
    type: builtin
    builtin: decision-resolution
    artifacts: [delivery-analysis.impacts]
  answer_review:
    type: builtin
    builtin: decision-answer-review
    artifacts: [delivery-analysis.answer-review]
  delivery_contract:
    type: artifact
    artifacts:
      - delivery-analysis.summary
      - delivery-analysis.contract
      - delivery-analysis.guardrails
      - delivery-analysis.verification-focus
    instructions: 把已收敛影响和决策登记为 Dev 与 Test 共同依赖的冻结交付契约。summary 和 contract 必须完成；必要时补充 guardrails 与 verification-focus。契约只约束用户可观察结果，不要保存逐文件实现计划或完整测试步骤。
  finalize:
    type: confirmation
    instructions: 最终检查影响、决策和交付契约是否一致，确认没有遗漏或冲突。发现问题时不要提交，使用 phase rewind 回到对应阶段修正。
