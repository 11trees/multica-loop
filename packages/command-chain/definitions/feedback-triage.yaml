version: 1
id: feedback-triage
agent: feedback-agent

artifacts:
  feedback:
    type: builtin
    title: 反馈分流
    blocks:
      inputs:
        title: 冻结反馈评论
        cardinality: many
        format: yaml
        writable: false
        required: true
        fields:
          commentId: { type: string, required: true, label: 评论 ID }
      meta:
        title: 冻结反馈批次
        cardinality: one
        format: yaml
        writable: false
        required: true
        fields:
          batchId: { type: string, required: true, label: 批次 ID }
          totalStories: { type: string, required: true, label: 交付单元总数 }
      summary:
        title: 反馈分流摘要
        cardinality: one
        format: markdown
        required: true
      groups:
        title: 反馈工作组
        cardinality: many
        format: yaml
        required: true
        fields:
          workType: { type: enum, required: true, values: [reply, historical_correction, report_correction, bug, behavior_change, scope_addition, technical_change, learning_only], label: 工作类型 }
          title: { type: string, label: 标题 }
          reason: { type: string, required: true, label: 原因 }
          response: { type: string, label: 回复 }
          commentIds: { type: array, required: true, minItems: 1, label: 评论 ID }
          affectedDeliveryUnits: { type: array, required: true, label: 受影响交付单元 }
          acceptance: { type: array, required: true, label: 验收语义 }
      answer-review:
        title: 澄清答案复查
        cardinality: one
        format: markdown
        required: true

phases:
  # Freeze every comment and the existing delivery-unit count.
  inputs:
    type: builtin
    builtin: feedback-triage-inputs

  # Propose complete clarifications that change group boundaries or acceptance.
  clarification_proposal:
    type: builtin
    builtin: decision-proposal

  # Resolve autonomous choices or pause for the complete human question batch.
  clarification_resolution:
    type: builtin
    builtin: decision-resolution

  # Consume authenticated answers on the original decision keys.
  answer_review:
    type: builtin
    builtin: decision-answer-review
    artifacts: [feedback.answer-review]

  # Assign every frozen comment exactly once with complete routing facts.
  grouping:
    type: artifact
    artifacts: [feedback.summary, feedback.groups]
    instructions: 对当前批次做完整分流，并消费全部已关闭澄清。每条冻结评论必须且只能属于一个稳定 group key；直接回复和历史更正写 response，任何会产生后续工作的类型必须提供标题和可验证 acceptance。

  # Validate coverage, group structure and resolved clarifications.
  finalize:
    type: builtin
    builtin: feedback-triage-finalize
